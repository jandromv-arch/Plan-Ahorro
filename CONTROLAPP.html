<style>
  :root{--navy:#12203a;--teal:#0FB5A6;--coral:#F0685A;--amber:#F2B441;--purple:#8B6DB3;
        --ink:#1f2d3d;--muted:#7c8797;--bg:#f5f7fa;--card:#fff;--line:#e9edf2;--green:#22A06B}
  body.dark{--navy:#e8edf4;--ink:#e8edf4;--muted:#8a97a8;--bg:#0e1521;--card:#161f2e;--line:#243040}
  body.dark .selarrow{background:#243040;color:#e8edf4}
  body.dark th{background:#0b1220}
  body.dark .kpi-x{background:#3a475c}
  body.dark select.f,body.dark td select{background:#161f2e;color:#e8edf4;border-color:#243040}
  body.dark .btn-ghost{background:#161f2e;color:#e8edf4;border-color:#243040}
  body.dark .modal{background:#161f2e;color:#e8edf4}
  body.dark .modal select,body.dark .modal input,body.dark .param input{background:#0e1521;color:#e8edf4;border-color:#243040}
  body.dark .drop{border-color:#3a475c;color:#8a97a8}
  body.dark .drop.hover{background:#12303a;color:#e8edf4}
  body.dark .tabs{background:#161f2e;border-color:#243040}
  body.dark .bar,body.dark .metabar{background:#243040}
  body.dark .badge.ok{background:#123a29;color:#4fd39a}
  body.dark .badge.no{background:#3a1c1c;color:#ff8a7d}
  body.dark .tag.trans{background:#243040;color:#8a97a8}
  body.dark input[type=date]{color-scheme:dark}
  body.dark .param{background:#0e1521}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:76px}
  .wrap{max-width:900px;margin:0 auto;padding:14px}
  .head{display:flex;align-items:center;gap:10px;margin-bottom:14px}
  .brand{display:flex;align-items:center;gap:9px}
  .brand-txt{font-size:20px;font-weight:800;color:var(--navy);letter-spacing:-.3px}
  .brand-hl{color:var(--teal)}
  .head .title-icon{margin-left:2px}
  .head .sp{margin-left:auto;display:flex;gap:8px}
  .btn{border:0;border-radius:11px;padding:9px 13px;font-weight:700;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
  .btn-primary{background:var(--teal);color:#fff}.btn-ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
  .btn:active{transform:scale(.97)}
  select,input{font-family:inherit}
  select.f{border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-weight:700;font-size:13px;background:#fff;color:var(--ink)}
  .filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
  .selmes{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px;margin-bottom:12px}
  .selarrow{flex:0 0 44px;height:44px;border:0;border-radius:11px;background:var(--bg);color:var(--navy);font-size:24px;font-weight:800;cursor:pointer;line-height:1}
  .selarrow:disabled{opacity:.3;cursor:default}
  .selarrow:active:not(:disabled){background:var(--teal);color:#fff}
  .selmes-label{flex:1;text-align:center;font-size:16px;font-weight:800;color:var(--navy);cursor:pointer;text-transform:capitalize}
  .kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px}
  @media(min-width:620px){.kpis{grid-template-columns:repeat(4,1fr)}}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:13px 15px;position:relative;overflow:hidden}
  .kpi:before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--c)}
  .kpi .lab{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.3px}
  .kpi .val{font-size:22px;font-weight:800;margin-top:5px}.kpi .sub{font-size:11px;color:var(--muted);margin-top:2px}
  .kpi-x{position:absolute;top:6px;right:6px;width:24px;height:24px;border:0;border-radius:50%;background:var(--navy);color:#fff;font-size:13px;font-weight:800;cursor:pointer;z-index:2;line-height:1;display:flex;align-items:center;justify-content:center}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:15px;margin-bottom:12px}
  .panel h3{margin:0 0 10px;font-size:14px;font-weight:800;color:var(--navy)}
  .chartbox{position:relative;height:250px}
  .empty{color:var(--muted);font-size:13px;text-align:center;padding:30px 0}
  table{width:100%;border-collapse:collapse;background:#fff;border-radius:12px;overflow:hidden;border:1px solid var(--line)}
  th{background:var(--navy);color:#fff;font-size:11px;padding:8px;text-align:left}
  td{padding:7px 8px;border-top:1px solid var(--line);font-size:12.5px}
  td select{border:1px solid var(--line);border-radius:6px;padding:4px;font-size:12px;width:100%;max-width:170px}
  td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  .neg{color:var(--coral)}.pos{color:var(--green)}
  .del{color:var(--coral);cursor:pointer;font-weight:800;border:0;background:none;font-size:15px}
  .tag{display:inline-block;padding:2px 7px;border-radius:20px;font-size:10px;font-weight:700}
  .tag.trans{background:#eef2f7;color:var(--muted)}.tag.pet{background:#fff2d6;color:#8a5a00}.tag.aho{background:#e6f6ee;color:var(--green)}
  .param{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
  .param label{display:block;font-size:11px;color:var(--muted);font-weight:700;margin-bottom:4px}
  .param input{border:1px solid var(--line);border-radius:8px;padding:8px;width:100%;font-size:14px;font-weight:700}
  .badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:13px;font-weight:800}
  .badge.ok{background:#e6f6ee;color:var(--green)}.badge.no{background:#fdeceb;color:var(--coral)}
  .bar{height:8px;background:#eef2f7;border-radius:6px;overflow:hidden;margin-top:4px}
  .bar>span{display:block;height:100%;background:var(--teal)}.bar.warn>span{background:var(--amber)}.bar.over>span{background:var(--coral)}
  .metabar{position:relative;height:34px;background:#eef2f7;border-radius:12px;overflow:hidden;margin-top:6px}
  .metabar>span{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--green));border-radius:12px;transition:width .4s}
  .metabar.warn>span{background:linear-gradient(90deg,var(--amber),#e89b1c)}
  .metabar.over>span{background:linear-gradient(90deg,var(--coral),#d94f42)}
  .metabar-txt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;color:var(--navy)}
  .cmp-row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-top:1px solid var(--line);font-size:14px;font-weight:600}
  .cmp-row:first-of-type{border-top:0}
  .cmp-eq{color:var(--muted);font-weight:700}
  .anual-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:8px;text-align:center}
  .anual-lab{font-size:10px;color:var(--muted);font-weight:700;text-transform:uppercase}
  .anual-val{font-size:18px;font-weight:800;margin-top:2px}
  .budgetrow{display:grid;grid-template-columns:1fr 100px auto;gap:8px;align-items:center;padding:7px 0;border-top:1px solid var(--line)}
  .budgetrow input{border:1px solid var(--line);border-radius:8px;padding:6px;font-size:13px}
  /* barra de pestañas inferior tipo app */
  .tabs{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:flex;z-index:40;box-shadow:0 -2px 10px rgba(0,0,0,.04)}
  .tab{flex:1;border:0;background:none;padding:9px 4px 8px;font-size:10.5px;font-weight:700;color:var(--muted);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
  .tab .ic{font-size:19px}
  .tab.active{color:var(--teal)}
  .view{display:none}.view.active{display:block}
  .tips div.tip{display:flex;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
  .overlay{position:fixed;inset:0;background:rgba(18,32,58,.5);display:none;align-items:flex-end;justify-content:center;z-index:60}
  .overlay.show{display:flex}
  .modal{background:#fff;border-radius:18px 18px 0 0;padding:20px;width:100%;max-width:640px;max-height:88vh;overflow:auto}
  @media(min-width:620px){.overlay{align-items:center}.modal{border-radius:18px}}
  .modal h3{margin:0 0 6px}.modal label{font-weight:700;font-size:13px;display:block;margin-top:10px}
  .modal select,.modal input[type=number],.modal input[type=text],.modal input[type=date]{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;font-size:14px}
  .drop{border:2px dashed #c7d0da;border-radius:14px;padding:24px;text-align:center;color:var(--muted);cursor:pointer;margin-top:10px}
  .drop.hover{border-color:var(--teal);background:#f0fbfa;color:var(--ink)}
  .row{display:flex;gap:10px;justify-content:flex-end;margin-top:16px}
  .unk{display:grid;grid-template-columns:1fr 180px;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
  .unk small{color:var(--muted);font-size:11px}
  .hint{font-size:12px;color:var(--muted)}
  pre{background:#0f1b2e;color:#d6e2f0;padding:10px;border-radius:8px;font-size:11px;overflow:auto}
</style>

<!-- DESGLOSE AHORRO -->
<div class="overlay" id="ov-desglose"><div class="modal">

  <div id="desgloseBody"></div>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
/* ================= LÓGICA (categorías, reglas, parsers) ================= */
var CATS=[['Vivienda (alquiler/hipoteca)','Esencial'],['Suministros (luz/agua/gas)','Esencial'],
['Comida / Supermercado','Esencial'],['Transporte','Esencial'],['Salud / Farmacia','Esencial'],
['Seguros','Esencial'],['Telefonia / Internet','Esencial'],['Deudas / Prestamos','Esencial'],
['Mascota','Esencial'],
['Restaurantes / Bares','Prescindible'],['Ocio / Entretenimiento','Prescindible'],
['Compras / Ropa','Prescindible'],['Suscripciones','Prescindible'],['Viajes','Prescindible'],
['Cafe / Snacks','Prescindible'],['Caprichos / Otros','Prescindible'],
['Ahorro (a MyInvestor)','Ahorro'],
['Traspaso interno','Traspaso'],['Ingresos / Abonos','Ingreso']];
var TIPO={}; CATS.forEach(function(c){TIPO[c[0]]=c[1];});
var CATNAMES=CATS.map(function(c){return c[0];});
// Categorías FIJAS (no tiene sentido sugerir recortarlas)
var CAT_FIJAS=['Vivienda (alquiler/hipoteca)','Suministros (luz/agua/gas)','Seguros','Deudas / Prestamos','Telefonia / Internet'];
function esFija(c){return CAT_FIJAS.indexOf(c)>=0;}
var CAT_TRASPASO='Traspaso interno';
var CAT_INGRESO='Ingresos / Abonos';
var CAT_AHORRO='Ahorro (a MyInvestor)';
var CAT_MASCOTA='Mascota';

// Palabras que identifican un ingreso REAL de nómina/facturación
var NOMINA_KW=['CARAT','REFINERY','SEEDTAG'];
// Conceptos que indican APORTACIÓN A AHORRO (tanto MyInvestor como Cuenta Naranja mensual)
var AHORRO_KW=['MYINVESTOR','MY INVESTOR','INVERSION','INVERSIÓN','MENSUAL','NARANJA','AHORRO'];
// Traspasos "puros" que no cuentan ni como gasto, ni como ingreso, ni como ahorro
// (ej. traspaso de Abanca a ING para pagar el piso, movimientos entre cuentas propias, etc.)
var TRASPASO_KW=['TRASPASO','IMPUESTOS RETENIDOS','INTERESES A SU FAVOR','SALDO INICIAL','SALDO FINAL','TRANSFERENCIA A MI','TRANSFERENCIA DESDE'];
// Conceptos de dinero compartido o del piso (traspasos internos, se ignoran en el cómputo)
var CONCEPTO_PISO=['PISO','RENT','TEAM','ALQUILER PISO','RESERVA PISO'];
// Conceptos personales que suelen ser bizums entre familia/amigos → tratar como traspaso
var CONCEPTO_PERSONAL=['SIN CONCEPTO','SOBRA','DEVUELVAS'];

function upper(s){return String(s||'').toUpperCase();}
function containsAny(s,arr){s=upper(s);for(var i=0;i<arr.length;i++){if(s.indexOf(arr[i])>=0)return true;}return false;}
function esNomina(concepto){return containsAny(concepto,NOMINA_KW);}
function esAhorro(concepto){return containsAny(concepto,AHORRO_KW);}
function esConceptoPiso(concepto){return containsAny(concepto,CONCEPTO_PISO);}
function esConceptoPersonal(concepto){return containsAny(concepto,CONCEPTO_PERSONAL);}
function esTraspasoObvio(concepto){
  var c=upper(concepto);
  for(var i=0;i<TRASPASO_KW.length;i++){if(c.indexOf(TRASPASO_KW[i])>=0)return true;}
  return false;
}
// Cuentas consideradas de AHORRO
function esCuentaAhorro(cuenta){
  var c=upper(cuenta||'');
  return c==='ING NARANJA' || c==='MYINVESTOR' || c.indexOf('NARANJA')>=0;
}
// Categoriza. Ahora usa la CUENTA para decidir bien:
//  - Movimiento en ING NARANJA o MyInvestor → CAT_AHORRO (aportación o retirada según signo)
//  - Concepto que menciona la otra cuenta de ahorro pero vive en NÓMINA/Abanca → también ahorro
//  - Los demás traspasos internos (NÓMINA↔NoCuenta) → CAT_TRASPASO
//  - Conceptos de piso/personal → CAT_TRASPASO
//  - Nómina reconocida (Carat/Refinery/Seedtag) → CAT_INGRESO
//  - Negativos con comercios → gasto según regla
function categorizar(concepto, importe, cuenta){
  var c=upper(concepto), cta=upper(cuenta||'');
  // 1) Si el movimiento está en una cuenta de AHORRO (Naranja o MyInvestor):
  //    - Si el concepto es de traspaso/transferencia → CAT_AHORRO (el movimiento en sí es entrada/salida de ahorro)
  //    - Si tiene un comercio reconocible (raro pero puede pasar) → gasto normal
  if(esCuentaAhorro(cta)){
    if(/TRASPASO|TRANSFERENCIA|BIZUM|INTERESES|IMPUESTOS|SALDO|APORT/i.test(c)) return CAT_AHORRO;
    var rr=matchRegla(concepto); return rr || CAT_AHORRO; // por defecto ahorro
  }
  // 2) Concepto explícito de ahorro (MENSUAL, INVERSION, MyInvestor)
  if(esAhorro(concepto)) return CAT_AHORRO;
  // 3) Traspaso obvio
  if(esTraspasoObvio(concepto)) return CAT_TRASPASO;
  // 4) Transferencia/Bizum con concepto de PISO o personal
  if(/TRANSFERENCIA/.test(c)||/BIZUM/.test(c)){
    if(esConceptoPiso(concepto)||esConceptoPersonal(concepto)) return CAT_TRASPASO;
  }
  // 5) POSITIVOS: nómina reconocida → ingreso real; resto en ING → traspaso
  if(importe>0){
    if(esNomina(concepto)) return CAT_INGRESO;
    if(cta.indexOf('ING')>=0) return CAT_TRASPASO;
    return CAT_TRASPASO;
  }
  // 6) NEGATIVOS: gasto real
  var r=matchRegla(concepto); return r||null;
}

// Signo del movimiento de ahorro (para saber si es aportación o retirada) y
// también para EVITAR duplicar el mismo traspaso visto desde las dos cuentas
// (ej. NÓMINA emite -500 y NARANJA recibe +500: solo contamos uno).
//   +1 = APORTACIÓN, -1 = RETIRADA, 0 = ignorar (duplicado)
function signoAhorro(concepto,importe,cuenta){
  var cta=upper(cuenta||'');
  // Vive en la propia cuenta de ahorro → ignoramos (ya lo contamos desde la de origen)
  if(esCuentaAhorro(cta)) return 0;
  // Vive en cuenta operativa (NÓMINA / NoCuenta / Abanca): el signo del importe manda
  return importe<0 ? +1 : -1;
}

function limpiarImporte(v){var s=String(v).replace(/\u00A0/g,'').replace(/[€\s]/g,'');if(s==='')return null;
  if(/,\d{1,2}$/.test(s)&&s.indexOf('.')>=0){s=s.replace(/\./g,'').replace(',','.');}else s=s.replace(',','.');
  var n=parseFloat(s);return isNaN(n)?null:Math.round(n*100)/100;}
function limpiarConcepto(v){return String(v||'').split('\\')[0].replace(/\s+/g,' ').trim();}
function parseFecha(v,yearHint){var s=String(v||'').trim();
  // formato dd/mm o dd/mm/yy o dd/mm/yyyy o yyyy-mm-dd
  var m=s.match(/^(\d{1,2})[\/\-.](\d{1,2})(?:[\/\-.](\d{2,4}))?$/);
  if(m){var d=+m[1],mo=+m[2],y=m[3]?+m[3]:(yearHint||new Date().getFullYear());if(y<100)y+=2000;
    if(mo>12&&d<=12){var t=d;d=mo;mo=t;} return y+'-'+('0'+mo).slice(-2)+'-'+('0'+d).slice(-2);}
  m=s.match(/^(\d{4})-(\d{2})-(\d{2})$/);if(m)return s;
  return null;}
function primeraPalabra(con){var t=String(con).toUpperCase().replace(/[ÁÀÄ]/g,'A').replace(/[ÉÈË]/g,'E').replace(/[ÍÌÏ]/g,'I').replace(/[ÓÒÖ]/g,'O').replace(/[ÚÙÜ]/g,'U').split(/[^A-ZÑ]+/).filter(function(x){return x.length>=4;});return t.length?t[0]:String(con).toUpperCase().trim();}
function matchRegla(con){var c=String(con).toUpperCase();for(var i=0;i<state.rules.length;i++){if(state.rules[i][0]&&c.indexOf(String(state.rules[i][0]).toUpperCase())>=0)return state.rules[i][1];}return null;}

function parseCsvBanco(txt){var lineas=txt.split('\n').filter(function(l){return l.trim();});
  var sep=detSep(lineas[0]);var filas=parseCsv(txt,sep);if(!filas.length)return [];
  var cab=filas[0].map(function(x){return String(x).toLowerCase().trim();});
  var joined=cab.join(' ');
  var hc = joined.indexOf('importe')>=0||joined.indexOf('amount')>=0||joined.indexOf('concepto')>=0||joined.indexOf('concept')>=0||joined.indexOf('fecha')>=0||joined.indexOf('date')>=0;
  var iF=0,iC=1,iImp=-1,iBal=-1;
  if(hc){
    // Fecha: 'fecha' o 'date' (pero NO 'date of operation/value' si hay una 'date' a secas)
    var jf=-1;cab.forEach(function(h,i){if(jf<0 && (h==='fecha'||h==='date'||h.indexOf('fecha')===0||h.indexOf('date')===0) && h.indexOf('operation')<0 && h.indexOf('value')<0 && h.indexOf('valor')<0 && h.indexOf('operac')<0)jf=i;});
    if(jf<0)cab.forEach(function(h,i){if(jf<0&&(h.indexOf('fecha')>=0||h.indexOf('date')>=0))jf=i;});
    iF=jf>=0?jf:0;
    // Concepto / Concept / Descripción
    for(var a=0;a<cab.length;a++){if(cab[a].indexOf('concepto')>=0||cab[a].indexOf('concept')>=0||cab[a].indexOf('descrip')>=0){iC=a;break;}}
    // Saldo / Balance (para NO confundirlo con el importe)
    for(var q=0;q<cab.length;q++){if(cab[q].indexOf('saldo')>=0||cab[q].indexOf('balance')>=0){iBal=q;break;}}
    // Importe / Amount (nunca la de saldo)
    for(var b=0;b<cab.length;b++){if((cab[b].indexOf('importe')>=0||cab[b].indexOf('amount')>=0||cab[b].indexOf('cargo')>=0) && b!==iBal){iImp=b;break;}}
  }
  if(iImp<0){
    // Sin cabecera clara: elegir la columna numérica con MÁS valores negativos (el importe tiene negativos; el saldo casi no)
    var best=-1,bestNeg=-1;var nc=filas[0].length;
    for(var col=0;col<nc;col++){ if(col===iBal)continue; var neg=0,num=0;
      for(var r=hc?1:0;r<Math.min(filas.length,40);r++){var v=(filas[r]||[])[col];var n=limpiarImporte(v);if(n!==null){num++;if(n<0)neg++;}}
      if(num>=3 && neg>bestNeg){bestNeg=neg;best=col;} }
    iImp=best>=0?best:3;
  }
  var out=[];for(var rr=(hc?1:0);rr<filas.length;rr++){var row=filas[rr];if(!row||row.length<=iImp)continue;
    var imp=limpiarImporte(row[iImp]);if(imp===null||imp===0)continue;
    var con=limpiarConcepto(row[iC]!==undefined?row[iC]:'');var fe=parseFecha(row[iF]);if(!fe)continue;
    out.push({f:fe,c:con,imp:imp});}return out;}

// Parser principal para PDF de ING: prueba primero el formato "Movimientos" (tabla con Categoría)
// y si no encaja, cae al parser del "Extracto integrado" mensual.
function parsePdfIng(txt){
  var mov=parsePdfIngMovimientos(txt);
  if(mov && mov.length) return mov;
  return parsePdfIngIntegrado(txt);
}

// ---------- Parser B: PDF "Movimientos" (exportación desde app/web) ----------
// Estructura: F. VALOR | CATEGORÍA | SUBCATEGORÍA | DESCRIPCIÓN | COMENTARIO | IMPORTE (€)
// Ejemplo de línea: "FECHA  Categoría  Subcategoría  Descripción del comercio  IMPORTE"
// Detalles importantes de este formato:
//   - Cada movimiento aparece DUPLICADO (dos filas con misma fecha/importe/desc → dedup por fecha+desc+importe)
//   - Trae CATEGORÍA propia que aprovechamos
//   - Los "Movimientos excluidos / Traspaso entre cuentas" son movimientos internos → ignorar/traspaso
//   - Los "Ahorro / Redondeo" son céntimos del redondeo → los tratamos como ahorro
function parsePdfIngMovimientos(txt){
  // Detectar formato por la cabecera (en cualquier orden de columnas)
  var U=upper(txt);
  var esFormatoMovimientos = (U.indexOf('F. VALOR')>=0 && U.indexOf('IMPORTE')>=0 && U.indexOf('SUBCATEGOR')>=0);
  if(!esFormatoMovimientos)return [];

  var mapaCat={
    'ALIMENTACION':'Comida / Supermercado','ALIMENTACIÓN':'Comida / Supermercado',
    'HOGAR':'Vivienda (alquiler/hipoteca)','OCIO Y VIAJES':'Ocio / Entretenimiento',
    'COMPRAS':'Compras / Ropa','EDUCACION Y SALUD':'Salud / Farmacia','EDUCACIÓN Y SALUD':'Salud / Farmacia',
    'TRANSPORTE':'Transporte','AHORRO':CAT_AHORRO,'MOVIMIENTOS EXCLUIDOS':CAT_TRASPASO,
    'OTROS INGRESOS':CAT_INGRESO,'VENTAJAS ING':CAT_TRASPASO,'OTROS GASTOS':'Caprichos / Otros'};
  var mapaSub={
    'CAFETERIAS Y RESTAURANTES':'Restaurantes / Bares','CAFETERÍAS Y RESTAURANTES':'Restaurantes / Bares',
    'MASCOTAS Y VETERINARIO':'Mascota','CINE, TEATRO Y ESPECTACULOS':'Ocio / Entretenimiento','CINE, TEATRO Y ESPECTÁCULOS':'Ocio / Entretenimiento',
    'ELECTRONICA':'Compras / Ropa','ELECTRÓNICA':'Compras / Ropa','LUZ Y GAS':'Suministros (luz/agua/gas)','AGUA':'Suministros (luz/agua/gas)',
    'TELEFONO, TV E INTERNET':'Telefonia / Internet','TELÉFONO, TV E INTERNET':'Telefonia / Internet',
    'FARMACIA, HERBOLARIO Y NUTRICION':'Salud / Farmacia','FARMACIA, HERBOLARIO Y NUTRICIÓN':'Salud / Farmacia',
    'SUPERMERCADOS Y ALIMENTACION':'Comida / Supermercado','SUPERMERCADOS Y ALIMENTACIÓN':'Comida / Supermercado',
    'MANTENIMIENTO DEL HOGAR':'Vivienda (alquiler/hipoteca)','TRASPASO ENTRE CUENTAS':CAT_TRASPASO,
    'REDONDEO':CAT_AHORRO,'INGRESO BIZUM':CAT_TRASPASO,'INGRESOS DE OTRAS ENTIDADES':CAT_TRASPASO,'ABONO DE INTERESES':CAT_TRASPASO,
    'COMPRAS (OTROS)':'Compras / Ropa','OTROS GASTOS (OTROS)':'Caprichos / Otros'};

  // Normalizar: un único string con espacios simples (los saltos de línea se vuelven espacios).
  // Así da igual cómo pdf.js parta el texto.
  var flat=txt.replace(/\r/g,' ').replace(/\n/g,' ').replace(/\u00A0/g,' ').replace(/\s+/g,' ');

  // Cada registro empieza por una FECHA dd/mm/yyyy. Partimos por fecha conservándola.
  var partes=flat.split(/(?=\b\d{2}\/\d{2}\/\d{4}\b)/);
  var out=[];
  partes.forEach(function(seg){
    seg=seg.trim(); if(!seg)return;
    var mf=seg.match(/^(\d{2}\/\d{2}\/\d{4})\b/); if(!mf)return;
    var fecha=mf[1];
    var cuerpo=seg.substring(fecha.length).trim();
    // localizar el importe: número con 2 decimales (punto o coma), posiblemente pegado a texto detrás
    var m=cuerpo.match(/(-?\d[\d.]*\.\d{2}|-?\d[\d.]*,\d{2})/);
    if(!m)return;
    var imp=limpiarImporte(m[1]); if(imp===null||imp===0)return;
    var antes=cuerpo.substring(0,m.index).trim();   // descripción (empieza con "Pago en..." o "Traspaso...")
    var despues=cuerpo.substring(m.index+m[1].length).trim(); // sub+categoría pegadas
    // A veces el importe está ANTES de la descripción (según orden de columnas). Si "antes" está vacío,
    // usamos "despues" como fuente de descripción/categoría.
    var cola=despues, descripcion=antes;
    if(!descripcion){ descripcion=despues; cola=''; }

    // Determinar categoría por sub/categoría encontrada en la "cola" (o en toda la parte no-descripción)
    var buscarEn=upper(cola+' '+antes);
    var catFinal=null;
    var subs=Object.keys(mapaSub).sort(function(a,b){return b.length-a.length;});
    for(var s=0;s<subs.length;s++){ if(buscarEn.indexOf(subs[s])>=0){catFinal=mapaSub[subs[s]];break;} }
    if(!catFinal){var cats=Object.keys(mapaCat).sort(function(a,b){return b.length-a.length;});
      for(var c=0;c<cats.length;c++){ if(buscarEn.indexOf(cats[c])>=0){catFinal=mapaCat[cats[c]];break;} } }

    // Limpiar descripción: quitar "Pago en", nombres de categoría pegados y textos de redondeo
    descripcion=descripcion.replace(/^Pago en\s+/i,'');
    // cortar la descripción si arrastró la sub/categoría (aparece "Cine, teatro..." etc.)
    Object.keys(mapaSub).concat(Object.keys(mapaCat)).forEach(function(kk){
      var idx=upper(descripcion).indexOf(kk);
      if(idx>0)descripcion=descripcion.substring(0,idx).trim();
    });
    descripcion=limpiarConcepto(descripcion);
    if(!descripcion||descripcion.length<2)descripcion='movimiento';

    out.push({f:isoFecha(fecha),c:descripcion,imp:imp,subcuenta:'ING',categoriaING:catFinal});
  });

  // Deduplicar (ING repite cada movimiento) por fecha+desc+importe
  var seen={},dedup=[];
  out.forEach(function(r){var k=r.f+'|'+r.c+'|'+r.imp.toFixed(2);if(seen[k]){return;}seen[k]=1;dedup.push(r);});
  return dedup;
}
function isoFecha(dmy){var p=String(dmy).split('/');if(p.length!==3)return null;return p[2]+'-'+('0'+p[1]).slice(-2)+'-'+('0'+p[0]).slice(-2);}

// ---------- Parser A: "Extracto integrado" mensual (el de siempre) ----------
function parsePdfIngIntegrado(txt){var lines=txt.split('\n');
  var out=[]; var yearHint=(new Date()).getFullYear();
  for(var i=0;i<Math.min(lines.length,50);i++){var m=lines[i].match(/\b(20\d{2})\b/);if(m){yearHint=+m[1];break;}}
  var reCta=/Cuenta\s+(N[ÓO]MINA|NoCuenta|NARANJA|NARANJA\s*AHORRO|COMBINADA|EFECTIVO)\s*-?\s*IBAN/i;
  var reMov=/^\s*(\d{2}\/\d{2})\s+(\d{2}\/\d{2})\s+(.+?)\s+(-?\d[\d\.]*,\d{2})\s*€?\s+(-?\d[\d\.]*,\d{2})\s*€?\s*$/;
  var subcuenta='ING NÓMINA';
  lines.forEach(function(l){
    var mc=l.match(reCta);
    if(mc){var tipo=mc[1].toUpperCase();
      if(/NARANJA/.test(tipo))subcuenta='ING NARANJA';
      else if(/NOCUENTA/.test(tipo))subcuenta='ING NoCuenta';
      else if(/NÓMINA|NOMINA/.test(tipo))subcuenta='ING NÓMINA';
      else subcuenta='ING '+tipo;
      return;
    }
    var m=l.match(reMov);
    if(m){var f=parseFecha(m[1],yearHint);var con=limpiarConcepto(m[3]);var imp=limpiarImporte(m[4]);
      if(f && con && imp!==null && imp!==0) out.push({f:f,c:con,imp:imp,subcuenta:subcuenta});}
  });
  // CRUCE: marcar los traspasos que tienen espejo en NARANJA (esos son los de ahorro)
  var enNaranja={};
  out.forEach(function(r){
    if(r.subcuenta==='ING NARANJA'){
      // clave: fecha + valor absoluto (importe opuesto al de la cuenta espejo)
      var k=r.f+'|'+Math.abs(r.imp).toFixed(2);
      enNaranja[k]=(enNaranja[k]||0)+1;
    }
  });
  out.forEach(function(r){
    if(r.subcuenta==='ING NARANJA')return;
    if(!/traspaso|transferencia interna/i.test(r.c))return;
    var k=r.f+'|'+Math.abs(r.imp).toFixed(2);
    if(enNaranja[k] && enNaranja[k]>0){
      // marcar el concepto para que la categorización lo reconozca como ahorro
      r.c = r.c + ' → Naranja';
      enNaranja[k]--;
    }
  });
  // Enriquecer con la sección "Información sobre transferencias" (piso, mensual, etc.)
  var enriquecer={};
  var reTr=/^\s*(\d{2}\/\d{2})\s+(.*?)\s+(\d[\d\.]*,\d{2})\s*€/;
  for(var i2=0;i2<lines.length;i2++){
    var ln=lines[i2]; var m2=ln.match(reTr); if(!m2) continue;
    var trozo=(lines[i2]+' '+(lines[i2+1]||'')+' '+(lines[i2+2]||'')+' '+(lines[i2+3]||'')).toUpperCase();
    var kws=['MENSUAL','INVERSION','INVERSIÓN','MYINVESTOR','MY INVESTOR','PISO','RENT','TEAM','SOBRA','APL','BIZUM','SIN CONCEPTO'];
    var kwFound=null;for(var k=0;k<kws.length;k++){if(trozo.indexOf(kws[k])>=0){kwFound=kws[k];break;}}
    if(!kwFound)continue;
    var fecha=parseFecha(m2[1],yearHint); var imp=limpiarImporte(m2[3]);
    if(!fecha||imp===null)continue;
    enriquecer[fecha+'|'+imp.toFixed(2)] = kwFound;
    enriquecer[fecha+'|'+(-imp).toFixed(2)] = kwFound;
  }
  out.forEach(function(r){
    var key = r.f+'|'+r.imp.toFixed(2);
    if(enriquecer[key]){
      var kw=enriquecer[key];
      if(/TRANSFERENCIA|TRASPASO|BIZUM|DEVOLUCIONES/i.test(r.c)) r.c = r.c + ' — ' + kw;
    }
  });
  return out;
}

function detSep(l){var s=[[',',(l.match(/,/g)||[]).length],[';',(l.match(/;/g)||[]).length],['\t',(l.match(/\t/g)||[]).length]];s.sort(function(a,b){return b[1]-a[1];});return s[0][1]>0?s[0][0]:',';}
function parseCsv(t,sep){var rows=[],row=[],f='',q=false;for(var i=0;i<t.length;i++){var ch=t[i];
  if(q){if(ch=='"'){if(t[i+1]=='"'){f+='"';i++;}else q=false;}else f+=ch;}
  else{if(ch=='"')q=true;else if(ch===sep){row.push(f);f='';}else if(ch=='\n'){row.push(f);rows.push(row);row=[];f='';}else if(ch!='\r')f+=ch;}}
  if(f!==''||row.length){row.push(f);rows.push(row);}return rows;}

var eur0=new Intl.NumberFormat('es-ES',{style:'currency',currency:'EUR',maximumFractionDigits:0});
var eur2=new Intl.NumberFormat('es-ES',{style:'currency',currency:'EUR',maximumFractionDigits:2});
var pct=function(x){return (x*100).toFixed(1).replace('.',',')+'%';};
var PAL=['#12203a','#0FB5A6','#F2B441','#F0685A','#8B6DB3','#457B9D','#8AB17D','#E9D8A6','#B5838D','#A8DADC','#F6BD60','#F28482','#84A59D','#B08968','#6D6875','#2A9D8F','#D62828'];
function mesLegible(ym){var m=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];var p=String(ym).split('-');return p.length>=2?(m[(+p[1])-1]+' '+p[0]):ym;}
function esc(s){return String(s).replace(/[<>&]/g,function(c){return{'<':'&lt;','>':'&gt;','&':'&amp;'}[c];});}

/* ================= FILTROS + CÁLCULO ================= */
var tab='resumen', mes='todos', catFilter='', maskFilter='', hormFilter=false, evoMode='ahorro', charts={};
function movs(){var umb=state.params.umbral||0;return state.mov.filter(function(m){
  if(mes!=='todos' && String(m.f).slice(0,7)!==mes) return false;
  if(maskFilter==='pet' && m.cat!==CAT_MASCOTA) return false;
  if(maskFilter==='nopet' && m.cat===CAT_MASCOTA) return false;
  if(catFilter && m.cat!==catFilter) return false;
  if(hormFilter){if(m.cat===CAT_INGRESO||m.cat===CAT_TRASPASO||m.cat===CAT_AHORRO)return false;if(!(+m.imp<0&&umb>0&&Math.abs(+m.imp)<=umb))return false;}
  return true;
});}
function meses(){var s={};state.mov.forEach(function(m){var k=String(m.f).slice(0,7);if(/^\d{4}-\d{2}$/.test(k))s[k]=1;});return Object.keys(s).sort();}
function ingresosDe(ym){var t=0;state.mov.forEach(function(m){if(ym&&String(m.f).slice(0,7)!==ym)return;if(m.cat===CAT_INGRESO&&+m.imp>0)t+=+m.imp;});return t;}
function gastosDe(ym){var t=0;state.mov.forEach(function(m){if(ym&&String(m.f).slice(0,7)!==ym)return;if(m.cat===CAT_INGRESO||m.cat===CAT_TRASPASO||m.cat===CAT_AHORRO)return;if(+m.imp<0)t+=(-m.imp);});return t;}
function ahorroExpDe(ym){var t=0;state.mov.forEach(function(m){if(ym&&String(m.f).slice(0,7)!==ym)return;if(m.cat!==CAT_AHORRO)return;var s=signoAhorro(m.c,+m.imp||0,m.tar||'');if(s===0)return;t+=Math.abs(+m.imp||0)*s;});return t;}
function calc(){
  var ms=movs();var ingresos=0,gastos=0,esen=0,presc=0,horm=0,hormN=0,masc=0,aho=0,porCat={};
  CATNAMES.forEach(function(n){porCat[n]=0;});var umb=state.params.umbral||0;
  ms.forEach(function(m){var imp=+m.imp;if(!imp)return;
    if(m.cat===CAT_TRASPASO)return;
    if(m.cat===CAT_INGRESO){if(imp>0)ingresos+=imp;return;}
    if(m.cat===CAT_AHORRO){var s=signoAhorro(m.c,imp,m.tar||'');if(s===0)return;aho+=Math.abs(imp)*s;porCat[m.cat]=(porCat[m.cat]||0)+Math.abs(imp)*s;return;}
    if(imp<0){var g=-imp;gastos+=g;porCat[m.cat]=(porCat[m.cat]||0)+g;var t=TIPO[m.cat]||'';if(t==='Esencial')esen+=g;else if(t==='Prescindible')presc+=g;if(m.cat===CAT_MASCOTA)masc+=g;if(umb>0&&g<=umb){horm+=g;hormN++;}}});
  var nMeses=mes==='todos'?Math.max(meses().length,1):1;
  return {ingresos:ingresos,gastos:gastos,ahorroExplicito:aho,ahorroResiduo:ingresos-gastos-aho,
    esen:esen,presc:presc,mascota:masc,horm:horm,hormN:hormN,obj:(+state.params.obj||0)*nMeses,
    pct:ingresos>0?(ingresos-gastos)/ingresos:0,porCat:porCat};}
function ahorroTotalHistorico(){var ini=+state.params.saldoInicial||0,corte=state.params.saldoFecha||'',sum=0;
  state.mov.forEach(function(m){if(m.cat!==CAT_AHORRO)return;if(corte&&String(m.f)<=corte)return;var s=signoAhorro(m.c,+m.imp||0,m.tar||'');if(s===0)return;sum+=Math.abs(+m.imp||0)*s;});return ini+sum;}
function promedioAhorro(){var ms=meses();if(!ms.length)return {v:0,fuente:'sin-datos'};var hoy=new Date().toISOString().slice(0,7);var pas=ms.filter(function(m){return m<hoy;});var mu=pas.length?pas:ms;
  var s=0;mu.forEach(function(m){s+=ahorroExpDe(m);});if(s>0)return {v:s/mu.length,fuente:'aportaciones',n:mu.length};
  s=0;mu.forEach(function(m){s+=ingresosDe(m)-gastosDe(m);});return {v:s/mu.length,fuente:'implicito',n:mu.length};}

/* ================= NAV ================= */
function setTab(t){tab=t;[].forEach.call(document.querySelectorAll('.tab'),function(b){b.classList.toggle('active',b.dataset.v===t);});
  [].forEach.call(document.querySelectorAll('.view'),function(v){v.classList.remove('active');});
  document.getElementById('v-'+t).classList.add('active');
  document.querySelector('.filters').style.display=(t==='ajustes')?'none':'flex';
  render();window.scrollTo(0,0);}
function setMes(v){mes=v;render();}
function setMask(v){maskFilter=v;render();}
function setCatFilter(v){catFilter=v;render();}
function setEvoMode(v){evoMode=v;drawEvo();}
function pintarFiltros(){
  var ms=meses();if(mes!=='todos'&&ms.indexOf(mes)<0)mes='todos';
  var sc=document.getElementById('catFilter');if(sc){sc.innerHTML='<option value="">🏷️ Categoría</option>'+CATNAMES.map(function(c){return '<option value="'+c+'">'+c+'</option>';}).join('');sc.value=catFilter;}
}

/* ================= RENDER ================= */
function render(){
  pintarFiltros();
  if(tab==='resumen')renderResumen();
  else if(tab==='movs')renderMovs();
  else if(tab==='ahorro')renderAhorro();
  else if(tab==='ajustes')renderAjustes();
}
var editKpis=false;
function kpiHidden(key){return (state.hiddenKpis||[]).indexOf(key)>=0;}
function kpi(key,l,v,c,s,onclick){
  if(kpiHidden(key)&&!editKpis)return '';
  var x=editKpis?'<button class="kpi-x" onclick="event.stopPropagation();hideKpi(\''+key+'\')">'+(kpiHidden(key)?'＋':'✕')+'</button>':'';
  var faded=editKpis&&kpiHidden(key)?';opacity:.4':'';
  return '<div class="kpi" style="--c:'+c+(onclick&&!editKpis?';cursor:pointer':'')+faded+'"'+(onclick&&!editKpis?' onclick="'+onclick+'"':'')+'>'+x+'<div class="lab">'+l+'</div><div class="val">'+v+'</div>'+(s?'<div class="sub">'+s+'</div>':'')+'</div>';
}
function hideKpi(key){var h=state.hiddenKpis||[];var i=h.indexOf(key);if(i>=0)h.splice(i,1);else h.push(key);state.hiddenKpis=h;guardar();renderResumen();}
function toggleEditKpis(){editKpis=!editKpis;renderResumen();}
function destroy(id){if(charts[id]){charts[id].destroy();delete charts[id];}}

function renderResumen(){
  var d=calc();var cumple=d.ahorroExplicito>=d.obj;
  var editBtn='<div style="display:flex;justify-content:flex-end;margin-bottom:8px">'
    +'<button class="btn btn-ghost" style="padding:5px 11px;font-size:12px" onclick="toggleEditKpis()">'+(editKpis?'✅ Hecho':'✏️ Editar tarjetas')+'</button></div>';
  var kA=kpi('ingresos','Ingresos',eur0.format(d.ingresos),'var(--teal)','nómina real')
    +kpi('gastos','Gastos',eur0.format(d.gastos),'var(--coral)','sin traspasos')
    +kpi('ahorroMes','Ahorro mes',eur0.format(d.ahorroExplicito),'var(--navy)','a MyInvestor/Naranja')
    +kpi('sinGastar',d.ahorroResiduo>=0?'Sin gastar':'Déficit',eur0.format(d.ahorroResiduo),d.ahorroResiduo>=0?'var(--green)':'var(--coral)','ingresos−gastos−ahorro');
  var hormCard=kpiHidden('hormiga')&&!editKpis?'':'<div class="kpi" style="--c:var(--purple)'+(editKpis&&kpiHidden('hormiga')?';opacity:.4':'')+(editKpis?'':';cursor:pointer')+'"'+(editKpis?'':' onclick="toggleHorm()"')+'>'+(editKpis?'<button class="kpi-x" onclick="event.stopPropagation();hideKpi(\'hormiga\')">'+(kpiHidden('hormiga')?'＋':'✕')+'</button>':'')+'<div class="lab">Hormiga 🐜</div><div class="val">'+eur0.format(d.horm)+'</div><div class="sub">'+d.hormN+' mov · toca para ver</div></div>';
  var objCard=kpiHidden('objetivoCheck')&&!editKpis?'':'<div class="kpi" style="--c:'+(cumple?'var(--green)':'var(--coral)')+(editKpis&&kpiHidden('objetivoCheck')?';opacity:.4':'')+'">'+(editKpis?'<button class="kpi-x" onclick="event.stopPropagation();hideKpi(\'objetivoCheck\')">'+(kpiHidden('objetivoCheck')?'＋':'✕')+'</button>':'')+'<div class="lab">Objetivo</div><div class="val"><span class="badge '+(cumple?'ok':'no')+'">'+(cumple?'✅':'❌')+'</span></div></div>';
  var kB=kpi('mascota','🐾 Mascota',eur2.format(d.mascota),'var(--amber)','')
    +hormCard
    +kpi('objetivo','Objetivo',eur0.format(d.obj),'var(--muted)','')
    +objCard;
  document.getElementById('v-resumen').innerHTML=
     selectorMes()
    +editBtn
    +'<div class="kpis">'+kA+'</div>'
    +'<div class="kpis">'+kB+'</div>'
    +(editKpis?'<div class="hint" style="text-align:center;margin:-4px 0 12px">Toca ✕ para ocultar una tarjeta, ＋ para recuperarla.</div>':'')
    +comparativaMes()
    +resumenAnual()
    +'<div class="panel"><h3>🧭 ¿Dónde se va el dinero?</h3><div class="chartbox"><canvas id="cDon"></canvas></div></div>'
    +'<div class="panel"><h3>⚖️ Gasto vs Ahorro</h3><div class="chartbox"><canvas id="cBar"></canvas></div></div>'
    +renderPresupuestos()
    +renderTips();
  drawDon(d);drawBar(d);
}
function toggleHorm(){hormFilter=true;catFilter='';setTab('movs');}
function resumenAnual(){
  if(mes!=='todos')return '';
  var ms=meses();if(ms.length<2)return '';
  var año=ms[ms.length-1].slice(0,4);
  var msAño=ms.filter(function(m){return m.slice(0,4)===año;});
  if(msAño.length<2)return '';
  var totIng=0,totGas=0,totAho=0,mejorMes=null,mejorAho=-1e9,peorMes=null,peorSaldo=1e9;
  msAño.forEach(function(m){var i=ingresosDe(m),g=gastosDe(m),a=ahorroExpDe(m);totIng+=i;totGas+=g;totAho+=a;
    if(a>mejorAho){mejorAho=a;mejorMes=m;}
    var saldo=i-g;if(saldo<peorSaldo){peorSaldo=saldo;peorMes=m;}});
  return '<div class="panel"><h3>📆 Resumen '+año+'</h3>'
    +'<div class="anual-grid">'
    +'<div><div class="anual-lab">Ingresos</div><div class="anual-val" style="color:var(--teal)">'+eur0.format(totIng)+'</div></div>'
    +'<div><div class="anual-lab">Gastos</div><div class="anual-val" style="color:var(--coral)">'+eur0.format(totGas)+'</div></div>'
    +'<div><div class="anual-lab">Ahorrado</div><div class="anual-val" style="color:var(--green)">'+eur0.format(totAho)+'</div></div>'
    +'</div>'
    +'<div class="cmp-row"><span>🏆 Mejor mes de ahorro</span><span style="font-weight:700">'+(mejorMes?mesLegible(mejorMes)+' ('+eur0.format(mejorAho)+')':'—')+'</span></div>'
    +'<div class="cmp-row"><span>📉 Mes más ajustado</span><span style="font-weight:700">'+(peorMes?mesLegible(peorMes):'—')+'</span></div>'
    +'</div>';
}
function detectarSuscripciones(){
  // comercios que aparecen en 2+ meses con importe similar. Priorizamos gastos "fijos" reales.
  var excluir=['Comida / Supermercado','Restaurantes / Bares','Cafe / Snacks','Compras / Ropa','Caprichos / Otros'];
  var porComercio={};
  state.mov.forEach(function(m){if(+m.imp>=0)return;if(m.cat===CAT_TRASPASO||m.cat===CAT_AHORRO)return;if(excluir.indexOf(m.cat)>=0)return;
    var kw=primeraPalabra(m.c);var mesM=String(m.f).slice(0,7);
    if(!porComercio[kw])porComercio[kw]={meses:{},ejemplo:m.c,cat:m.cat,importes:[]};
    porComercio[kw].meses[mesM]=1;porComercio[kw].importes.push(Math.abs(+m.imp));});
  var subs=[];
  for(var kw in porComercio){var pc=porComercio[kw];var nMeses=Object.keys(pc.meses).length;
    if(nMeses>=2){var med=pc.importes.reduce(function(a,b){return a+b;},0)/pc.importes.length;
      var similar=pc.importes.every(function(x){return Math.abs(x-med)/med<0.35;});
      if(similar)subs.push({nombre:pc.ejemplo,cat:pc.cat,meses:nMeses,importe:med});}}
  subs.sort(function(a,b){return b.importe-a.importe;});
  return subs;
}
function comparativaMes(){
  if(mes==='todos')return '';
  var ms=meses();var idx=ms.indexOf(mes);if(idx<=0)return ''; // no hay mes anterior
  var prev=ms[idx-1];
  var gAct=gastosDe(mes),gPrev=gastosDe(prev);
  var aAct=ahorroExpDe(mes),aPrev=ahorroExpDe(prev);
  if(gPrev===0&&aPrev===0)return '';
  function fila(lab,act,prev,bueno){ // bueno='menos'→bajar es bueno; 'mas'→subir es bueno
    if(prev===0)return '';
    var dif=act-prev;var pctg=Math.round(Math.abs(dif)/prev*100);
    if(dif===0)return '<div class="cmp-row"><span>'+lab+'</span><span class="cmp-eq">= igual</span></div>';
    var sube=dif>0;var esBueno=(bueno==='menos')?!sube:sube;
    var col=esBueno?'var(--green)':'var(--coral)';var flecha=sube?'▲':'▼';
    return '<div class="cmp-row"><span>'+lab+'</span><span style="color:'+col+';font-weight:700">'+flecha+' '+pctg+'% '+(sube?'más':'menos')+'</span></div>';
  }
  var filas=fila('Gastos',gAct,gPrev,'menos')+fila('Ahorro',aAct,aPrev,'mas');
  if(!filas)return '';
  return '<div class="panel"><h3>📊 vs '+mesLegible(prev)+'</h3>'+filas+'</div>';
}
function selectorMes(){
  var ms=meses();
  var etiqueta = mes==='todos' ? 'Todos los meses' : mesLegible(mes);
  var idx = mes==='todos' ? -1 : ms.indexOf(mes);
  // ‹ hay anterior si idx>0, o si estamos en 'todos' y hay meses
  var hayPrev = (mes!=='todos' && idx>0);
  var hayNext = (mes!=='todos' && idx>=0 && idx<ms.length-1);
  return '<div class="selmes">'
    +'<button class="selarrow" '+(hayPrev?'':'disabled')+' onclick="mesAnterior()">‹</button>'
    +'<div class="selmes-label" onclick="mesTodos()">'+etiqueta+(mes==='todos'?'':' <span style="font-size:10px;color:var(--muted);font-weight:600">· toca para ver todos</span>')+'</div>'
    +'<button class="selarrow" '+(hayNext?'':'disabled')+' onclick="mesSiguiente()">›</button>'
    +'</div>';
}
function mesAnterior(){var ms=meses();if(mes==='todos'){if(ms.length)mes=ms[ms.length-1];}else{var i=ms.indexOf(mes);if(i>0)mes=ms[i-1];}render();}
function mesSiguiente(){var ms=meses();if(mes==='todos'){if(ms.length)mes=ms[0];}else{var i=ms.indexOf(mes);if(i>=0&&i<ms.length-1)mes=ms[i+1];}render();}
function mesTodos(){mes=(mes==='todos'&&meses().length)?meses()[meses().length-1]:'todos';render();}

function renderMovs(){
  var ms=movs();
  var rows=ms.map(function(m){var idx=state.mov.indexOf(m);var cls=(+m.imp<0)?'neg':'pos';
    var tag=m.cat===CAT_TRASPASO?'<span class="tag trans">↔</span>':(m.cat===CAT_MASCOTA?'<span class="tag pet">🐾</span>':(m.cat===CAT_AHORRO?'<span class="tag aho">💰</span>':''));
    var sel='<select onchange="setCat('+idx+',this.value)">'+CATNAMES.map(function(c){return '<option'+(c===m.cat?' selected':'')+'>'+c+'</option>';}).join('')+'</select>';
    return '<tr><td>'+(m.f||'').slice(5)+'</td><td>'+esc((m.c||'').slice(0,28))+' '+tag+'</td><td class="num '+cls+'">'+eur2.format(+m.imp||0)+'</td><td>'+sel+'</td><td><button class="del" onclick="delMov('+idx+')">✕</button></td></tr>';}).join('');
  var filtros=[];if(mes!=='todos')filtros.push(mesLegible(mes));if(catFilter)filtros.push(catFilter);if(hormFilter)filtros.push('🐜');if(maskFilter==='pet')filtros.push('🐾');else if(maskFilter==='nopet')filtros.push('sin 🐾');
  var limpiar=(catFilter||hormFilter||maskFilter||mes!=='todos')?'<button class="btn btn-ghost" style="padding:4px 10px;font-size:12px" onclick="limpiar()">✕ Limpiar</button>':'';
  document.getElementById('v-movs').innerHTML=
    selectorMes()
    +'<div class="panel"><h3 style="display:flex;justify-content:space-between;align-items:center">Movimientos ('+ms.length+') '+limpiar+'</h3>'
    +(filtros.length?'<div class="hint" style="margin-bottom:8px">Filtros: '+filtros.join(' · ')+'</div>':'')
    +'<div style="overflow-x:auto;-webkit-overflow-scrolling:touch"><table><tr><th>Fecha</th><th>Concepto</th><th>€</th><th>Categoría</th><th></th></tr>'
    +(rows||'<tr><td colspan="5" style="color:#7c8797;padding:14px">Sin movimientos. Toca "Subir".</td></tr>')+'</table></div></div>';
}
function limpiar(){catFilter='';hormFilter=false;maskFilter='';mes='todos';render();}
function setCat(i,v){
  var m=state.mov[i];var kw=primeraPalabra(m.c);m.cat=v;
  var hermanos=[];state.mov.forEach(function(x,idx){if(idx===i)return;if(x.cat===v)return;if(primeraPalabra(x.c)===kw)hermanos.push(idx);});
  guardar();
  if(hermanos.length){if(confirm('Hay '+hermanos.length+' movimiento(s) más con "'+kw+'". ¿Cambiar todos a "'+v+'" y recordarlo?')){
    hermanos.forEach(function(idx){state.mov[idx].cat=v;});
    if(!state.rules.some(function(r){return String(r[0]).toUpperCase()===kw.toUpperCase();}))state.rules.push([kw,v]);
    guardar();}}
  render();
}
function delMov(i){var m=state.mov[i];if(!m)return;if(!confirm('¿Borrar este movimiento?\n\n'+(m.c||'')+'  ·  '+eur2.format(+m.imp||0)))return;state.mov.splice(i,1);guardar();render();}

  document.getElementById('v-ahorro').innerHTML=
     '<div class="kpis">'

    +'<div class="kpi" style="--c:var(--navy)"><div class="lab">Ahorro este mes</div><div class="val">'+eur0.format(d.ahorroExplicito)+'</div></div>'

    +'<div class="kpi" style="--c:var(--amber)"><div class="lab">Objetivo/mes</div><div class="val">'+eur0.format(+state.params.obj||0)+'</div></div>'

    +'<div class="panel"><h3>📅 Evolución mes a mes <select class="f" style="float:right;padding:3px 8px;font-size:12px" onchange="setEvoMode(this.value)"><option value="ahorro"'+(evoMode==='ahorro'?' selected':'')+'>Ahorro</option><option value="gastos"'+(evoMode==='gastos'?' selected':'')+'>Gastos</option><option value="ingresos"'+(evoMode==='ingresos'?' selected':'')+'>Ingresos</option></select></h3><div class="chartbox" id="evbox"><canvas id="cEvo"></canvas></div></div>';
  drawProy(pp);drawEvo();

function renderSuscripciones(){
  var subs=detectarSuscripciones();
  if(!subs.length)return '';
  var total=subs.reduce(function(a,b){return a+b.importe;},0);
  var filas=subs.slice(0,8).map(function(s){
    return '<div class="cmp-row"><span>'+esc(s.nombre.slice(0,24))+' <span style="color:var(--muted);font-size:11px">· '+s.meses+' meses</span></span><span style="font-weight:700">'+eur2.format(s.importe)+'/mes</span></div>';
  }).join('');
  return '<div class="panel"><h3>🔁 Gastos recurrentes detectados</h3>'
    +'<div class="hint" style="margin-bottom:6px">Comercios que se repiten cada mes con importe parecido. Revísalos: ~'+eur0.format(total)+'/mes en total.</div>'
    +filas+'</div>';
}
function renderMetaTotal(ahoAcum,pp){
  var meta=+state.params.objTotal||0;
  if(meta<=0){
    return '<div class="panel" style="text-align:center"><h3 style="margin-bottom:6px">🏁 Meta de ahorro total</h3>'
      +'<div class="hint">Ponte una meta (ej. 15.000€) en Ajustes y aquí verás cuánto te falta y cuándo la alcanzarás.</div>'
      +'<button class="btn btn-primary" style="margin-top:10px" onclick="setTab(\'ajustes\')">Poner mi meta</button></div>';
  }
  var pctg=Math.max(0,Math.min(ahoAcum/meta,1));
  var falta=Math.max(meta-ahoAcum,0);
  var ritmo=pp.v||0;
  var cls=pctg>=1?'':(pctg>=0.66?'':(pctg>=0.33?'warn':'over'));

  else if(ritmo>0){
    var mesesFaltan=Math.ceil(falta/ritmo);
    var fecha=new Date();fecha.setMonth(fecha.getMonth()+mesesFaltan);
    var fstr=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'][fecha.getMonth()]+' '+fecha.getFullYear();
    var tiempoTxt = mesesFaltan<=1?'el mes que viene':(mesesFaltan<12?('en '+mesesFaltan+' meses'):('en '+Math.floor(mesesFaltan/12)+' año'+(mesesFaltan>=24?'s':'')+(mesesFaltan%12?' y '+(mesesFaltan%12)+' meses':'')));
    proy='<div style="margin-top:12px;padding:12px;background:#eef7f2;border-radius:12px">'
      +'<div style="font-size:14px;font-weight:800;color:var(--navy)">📅 Si sigues ahorrando '+eur0.format(ritmo)+'/mes…</div>'
      +'<div style="font-size:13px;color:var(--ink);margin-top:4px">Alcanzarás tu meta <b style="color:var(--green)">'+tiempoTxt+'</b> (sobre '+fstr+'). Te faltan <b>'+eur0.format(falta)+'</b>.</div></div>';
  } else {
    proy='<div style="margin-top:12px;padding:12px;background:#fdeceb;border-radius:12px;font-size:13px">Aún no tengo ritmo de ahorro para estimar. Sube algún extracto con aportaciones.</div>';
  }
  return '<div class="panel">'
    +'<h3 style="display:flex;justify-content:space-between;align-items:center">🏁 Meta de ahorro total <span style="font-weight:normal;font-size:12px;color:var(--muted)">'+eur0.format(ahoAcum)+' / '+eur0.format(meta)+'</span></h3>'
    +'<div class="metabar '+cls+'"><span style="width:'+(pctg*100)+'%"></span><div class="metabar-txt">'+Math.round(pctg*100)+'%</div></div>'
    +proy+'</div>';
}

function renderPresupuestos(){
  var b=state.budgets||{},cats=Object.keys(b).filter(function(k){return b[k]>0;});if(!cats.length)return '';
  var mesRef=mes==='todos'?new Date().toISOString().slice(0,7):mes;var porCat={};
  state.mov.forEach(function(m){if(String(m.f).slice(0,7)!==mesRef)return;if(m.cat===CAT_TRASPASO||m.cat===CAT_INGRESO||m.cat===CAT_AHORRO)return;if(+m.imp<0)porCat[m.cat]=(porCat[m.cat]||0)+(-m.imp);});
  var html='<div class="panel"><h3>🎯 Presupuestos — '+mesLegible(mesRef)+'</h3>';
  cats.forEach(function(c){var g=porCat[c]||0,tope=+b[c],p=tope>0?Math.min(g/tope,1.3):0;var cls=p<0.75?'':(p<1?'warn':'over');
    // Alerta a mitad de mes: si el mes en curso y al ritmo actual vas a pasarte
    var aviso='';
    var hoy=new Date();var mesActual=hoy.toISOString().slice(0,7);
    if(mesRef===mesActual && tope>0){var dia=hoy.getDate();var diasMes=new Date(hoy.getFullYear(),hoy.getMonth()+1,0).getDate();
      if(dia>=5 && dia<diasMes){var proy=g/dia*diasMes;if(proy>tope*1.05){aviso=' <span style="color:var(--coral);font-size:11px;font-weight:700">⚠️ vas camino de '+eur0.format(proy)+'</span>';}}}
    html+='<div style="padding:6px 0"><div style="display:flex;justify-content:space-between;font-size:13px"><span><b>'+c+'</b>'+aviso+'</span><span>'+eur2.format(g)+' / '+eur2.format(tope)+' ('+Math.round(p*100)+'%)</span></div><div class="bar '+cls+'"><span style="width:'+Math.min(p*100,100)+'%"></span></div></div>';});
  return html+'</div>';
}
function generarTips(){
  var d=calc();var tips=[];
  var falta=d.obj-d.ahorroExplicito;
  if(falta>0&&d.obj>0)tips.push({i:'🎯',t:'Te faltan <b>'+eur0.format(falta)+'</b> para el objetivo. Programa una transferencia automática el día 1 (págate a ti primero).'});
  else if(d.ahorroExplicito>d.obj&&d.obj>0)tips.push({i:'🎉',t:'Has superado el objetivo. Prueba a subirlo un 10% el mes que viene (<b>'+eur0.format(d.obj*1.1)+'</b>).'});
  var arr=CATNAMES.map(function(c){return{c:c,v:d.porCat[c]||0};}).filter(function(x){return x.v>0&&x.c!==CAT_INGRESO&&x.c!==CAT_TRASPASO&&x.c!==CAT_AHORRO&&!esFija(x.c);}).sort(function(a,b){return b.v-a.v;});
  if(arr.length){var top=arr[0];var pt=d.gastos>0?top.v/d.gastos:0;
    if(pt>0.3)tips.push({i:'🔥',t:'Tu mayor gasto evitable es <b>'+top.c+'</b>: '+eur0.format(top.v)+' ('+Math.round(pt*100)+'%). Bajarlo un 15% te ahorra <b>'+eur0.format(top.v*0.15)+'</b>/mes.'});
    else tips.push({i:'🔎',t:'Lo que más pesa de lo evitable es <b>'+top.c+'</b> ('+eur0.format(top.v)+'). Toca el gráfico para revisarlo.'});}
  if(d.hormN>=10)tips.push({i:'🐜',t:'<b>'+d.hormN+' gastos hormiga</b> ('+eur0.format(d.horm)+'). Suman más de lo que parece; toca la tarjeta para verlos.'});
  var rest=(d.porCat['Restaurantes / Bares']||0)+(d.porCat['Cafe / Snacks']||0),comida=d.porCat['Comida / Supermercado']||0;
  if(rest>0&&rest>comida*0.6)tips.push({i:'🍽️',t:'Gastas <b>'+eur0.format(rest)+'</b> en restaurantes/café, casi como en súper. Cocinar 2 cenas más/semana ahorra ~<b>'+eur0.format(rest*0.25)+'</b>.'});
  var subs=d.porCat['Suscripciones']||0;if(subs>30)tips.push({i:'📺',t:'Suscripciones: <b>'+eur0.format(subs)+'</b>. Audita y cancela lo que no uses. 10€/mes = 120€/año.'});
  var fijo=0;CAT_FIJAS.forEach(function(c){fijo+=(d.porCat[c]||0);});
  if(fijo>d.gastos*0.5&&d.gastos>0)tips.push({i:'📞',t:'Los fijos son el <b>'+Math.round(fijo/d.gastos*100)+'%</b>. No se recortan, pero sí renegocian: compara luz y seguro una vez al año.'});
  if(!tips.length)tips.push({i:'👍',t:'Todo bajo control. Cada domingo, 5 minutos para categorizar lo nuevo y el mes cierra sin sorpresas.'});
  return tips.slice(0,5);
}
function renderTips(){var tips=generarTips();return '<div class="panel tips"><h3>💡 Tips para ahorrar</h3>'+tips.map(function(t){return '<div class="tip"><div style="font-size:20px;flex:0 0 28px;text-align:center">'+t.i+'</div><div style="font-size:13px;line-height:1.45">'+t.t+'</div></div>';}).join('')+'</div>';}

function volverPaso1(){document.getElementById('imp-step1').style.display='';document.getElementById('imp-step2').style.display='none';}
var drop=document.getElementById('drop'),fileInput=document.getElementById('file');
drop.addEventListener('click',function(){fileInput.click();});
['dragover','dragenter'].forEach(function(ev){drop.addEventListener(ev,function(e){e.preventDefault();drop.classList.add('hover');});});
['dragleave','drop'].forEach(function(ev){drop.addEventListener(ev,function(e){e.preventDefault();drop.classList.remove('hover');});});

function leerArchivo(f){var nombre=f.name.toLowerCase(),esPdf=nombre.endsWith('.pdf')||f.type==='application/pdf';window._isPdf=esPdf;
  document.getElementById('fname').textContent='📄 '+f.name;document.getElementById('imp-msg').innerHTML='⏳ Leyendo…';document.getElementById('btn-analizar').disabled=true;
  if(esPdf){var rd=new FileReader();rd.onload=async function(){try{var pdf=await pdfjsLib.getDocument({data:rd.result}).promise;var todo='';
    for(var p=1;p<=pdf.numPages;p++){var page=await pdf.getPage(p);var tc=await page.getTextContent();
      var lineas={};tc.items.forEach(function(it){var y=Math.round(it.transform[5]);if(!lineas[y])lineas[y]=[];lineas[y].push({x:it.transform[4],t:it.str});});
      var ys=Object.keys(lineas).map(Number).sort(function(a,b){return b-a;});
      ys.forEach(function(y){lineas[y].sort(function(a,b){return a.x-b.x;});todo+=lineas[y].map(function(o){return o.t;}).join(' ')+'\n';});}
    window._raw=todo;document.getElementById('imp-msg').innerHTML='✅ PDF leído ('+pdf.numPages+' págs). Pulsa Analizar.';document.getElementById('btn-analizar').disabled=false;
  }catch(e){document.getElementById('imp-msg').innerHTML='❌ No pude leer el PDF: '+e.message;}};rd.readAsArrayBuffer(f);}
  else{var rd=new FileReader();rd.onload=function(){window._raw=rd.result;document.getElementById('imp-msg').innerHTML='✅ CSV cargado. Pulsa Analizar.';document.getElementById('btn-analizar').disabled=false;};rd.readAsText(f,'utf-8');}}
function analizar(){
  var raw=window._raw;if(!raw){document.getElementById('imp-msg').innerHTML='⚠️ Elige un archivo primero.';return;}
  var banco=document.getElementById('imp-banco').value;
  var rows=window._isPdf?parsePdfIng(raw):parseCsvBanco(raw);
  if(!rows.length){document.getElementById('imp-msg').innerHTML='⚠️ No he encontrado movimientos.';return;}
  var vistos={};
  rows.forEach(function(r){r.cuenta=r.subcuenta||banco;var cat=r.categoriaING?r.categoriaING:categorizar(r.c,r.imp,r.cuenta);r.cat=cat;r.matched=!!cat;
    if(!cat){var kw=primeraPalabra(r.c);r.kw=kw;if(!vistos[kw])vistos[kw]={ejemplo:r.c,cat:'Caprichos / Otros'};}});
  pendientes={banco:banco,rows:rows,unknown:vistos};mostrarPaso2();
}
function mostrarPaso2(){var kws=Object.keys(pendientes.unknown);
  var ti=0,tg=0,tt=0;pendientes.rows.forEach(function(r){if(r.cat===CAT_TRASPASO)tt++;else if(r.cat===CAT_INGRESO)ti++;else if(r.imp<0)tg++;});
  document.getElementById('imp-resumen').innerHTML='<b>'+pendientes.rows.length+'</b> movimientos: '+ti+' ingresos · '+tg+' gastos · <span style="color:var(--muted)">'+tt+' traspasos (se ignoran)</span>. '+(kws.length?'Dime dónde va esto:':'¡Todo reconocido!');
  var opts=CATNAMES.filter(function(c){return c!==CAT_INGRESO&&c!==CAT_TRASPASO;}).map(function(c){return '<option'+(c==='Caprichos / Otros'?' selected':'')+'>'+c+'</option>';}).join('');
  document.getElementById('unknowns').innerHTML=kws.map(function(k){return '<div class="unk"><div><b>'+esc(k)+'</b><br><small>'+esc(pendientes.unknown[k].ejemplo.slice(0,30))+'</small></div><select onchange="setUnknown(\''+k.replace(/'/g,"\\'")+'\',this.value)">'+opts+'</select></div>';}).join('');
  document.getElementById('imp-step1').style.display='none';document.getElementById('imp-step2').style.display='';
}
function setUnknown(k,v){pendientes.unknown[k].cat=v;}
function confirmarImport(){
  var nuevas=pendientes.unknown;for(var k in nuevas)state.rules.push([k,nuevas[k].cat]);
  var nuevos=pendientes.rows.map(function(r){var cat=r.cat;if(!r.matched&&!cat)cat=nuevas[r.kw]?nuevas[r.kw].cat:'Caprichos / Otros';return {f:r.f,c:r.c,imp:r.imp,cat:cat,tar:(r.cuenta||pendientes.banco)};});
  var periodos={};nuevos.forEach(function(m){periodos[String(m.f).slice(0,7)+'|'+(m.tar||'')]=true;});
  var antes=state.mov.length;
  state.mov=state.mov.filter(function(m){return !periodos[String(m.f).slice(0,7)+'|'+(m.tar||'')];});
  var reemplazados=antes-state.mov.length;
  nuevos.forEach(function(m){state.mov.push(m);});
  guardar();closeM('ov-imp');setTab('movs');
  if(reemplazados>0)setTimeout(function(){alert('✅ Importado. Reemplacé '+reemplazados+' movimiento(s) antiguos del mismo mes/cuenta por los '+nuevos.length+' nuevos.');},120);
}

/* ---------- datos ---------- */
function exportBackup(){var blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='mis-gastos-backup.json';a.click();}
function importBackup(ev){var f=ev.target.files[0];if(!f)return;var rd=new FileReader();rd.onload=function(){try{state=JSON.parse(rd.result);if(!state.rules)state.rules=REGLAS_DEF.slice();if(!state.budgets)state.budgets={};guardar();render();alert('✅ Copia restaurada.');}catch(e){alert('Archivo no válido.');}};rd.readAsText(f);}
function borrarTodo(){if(!confirm('¿Borrar TODOS los movimientos? (ajustes y reglas se mantienen)'))return;state.mov=[];guardar();render();}
function importExcel(ev){var f=ev.target.files[0];if(!f)return;if(typeof XLSX==='undefined'){alert('Sin conexión, no puedo leer el Excel.');return;}
  var rd=new FileReader();rd.onload=function(){try{
    var wb=XLSX.read(rd.result,{type:'array'});
    var hojas=wb.SheetNames, filas=null;
    var candidatas=hojas.filter(function(h){return /alej|movim|gastos|datos/i.test(h);});
    (candidatas.length?candidatas:hojas).forEach(function(h){if(filas)return;var arr=XLSX.utils.sheet_to_json(wb.Sheets[h],{header:1,raw:false});
      var hi=-1;for(var i=0;i<arr.length;i++){var j=(arr[i]||[]).map(function(x){return String(x||'').toLowerCase();}).join(' ');if(j.indexOf('fecha')>=0&&j.indexOf('concepto')>=0&&j.indexOf('importe')>=0){hi=i;break;}}
      if(hi>=0)filas={arr:arr,hi:hi};});
    if(!filas){alert('No encontré una tabla con columnas Fecha / Concepto / Importe en el Excel.');return;}
    var arr=filas.arr,hi=filas.hi;var cab=arr[hi].map(function(x){return String(x||'').toLowerCase();});
    function col(keys){for(var i=0;i<cab.length;i++){for(var k=0;k<keys.length;k++){if(cab[i].indexOf(keys[k])>=0)return i;}}return -1;}
    var iF=col(['fecha']),iC=col(['concepto','descrip']),iImp=col(['importe','import']),iCat=col(['categor']),iTar=col(['tarjeta','cuenta','banco']);
    // ¿Los datos empiezan con el bloque de ejemplos del template? (marcado "ejemplos, bórralos")
    var hayMarcaEjemplo=false;
    for(var e=hi+1;e<Math.min(hi+3,arr.length);e++){if(/ejempl|b[óo]rr/i.test(String((arr[e]||[]).join(' ')))){hayMarcaEjemplo=true;break;}}
    var conceptosEjemplo=['alquiler piso','compra mercadona','cafe con leche','netflix','cena restaurante','devolucion tienda'];
    var nuevos=[],saltados=0;
    for(var r=hi+1;r<arr.length;r++){var row=arr[r]||[];var fRaw=row[iF],cc=row[iC],impRaw=row[iImp];
      if(fRaw==null&&cc==null&&impRaw==null)continue;
      if(/← ?ejempl|b[óo]rr/i.test(String(row.join(' '))))continue;
      // si el Excel trae los ejemplos del template, saltar esos conceptos concretos
      if(hayMarcaEjemplo && conceptosEjemplo.indexOf(String(cc||'').toLowerCase().trim())>=0)continue;
      var imp=limpiarImporte(impRaw);if(imp===null||imp===0){saltados++;continue;}
      var fe=parseFecha(fRaw);if(!fe){saltados++;continue;}
      var con=limpiarConcepto(cc||'');
      var cat=(iCat>=0&&row[iCat])?String(row[iCat]).trim():null;
      if(!cat||CATNAMES.indexOf(cat)<0)cat=categorizar(con,imp,(iTar>=0?String(row[iTar]||''):''))||'Caprichos / Otros';
      nuevos.push({f:fe,c:con,imp:imp,cat:cat,tar:(iTar>=0?String(row[iTar]||''):'')});}
    if(!nuevos.length){alert('No encontré movimientos válidos (¿solo estaban los ejemplos del template?).');return;}
    var añadidos=0;nuevos.forEach(function(m){var dup=state.mov.some(function(x){return x.f===m.f&&x.c===m.c&&Math.abs((+x.imp)-m.imp)<0.005;});if(!dup){state.mov.push(m);añadidos++;}});
    guardar();render();setTab('movs');
    alert('✅ Importé '+añadidos+' movimientos de tu Excel'+(saltados?(' ('+saltados+' filas sin datos válidos se saltaron)'):'')+'.');
  }catch(e){alert('No pude leer el Excel: '+e.message);}};rd.readAsArrayBuffer(f);}
function exportExcel(){if(typeof XLSX==='undefined'){alert('Sin conexión, no puedo generar el Excel.');return;}
  var r2=function(n){return Math.round(n*100)/100;};var wb=XLSX.utils.book_new();
  var mv=[['Fecha','Concepto','Importe','Categoría','Tipo','Cuenta','Mes']];
  state.mov.slice().sort(function(a,b){return String(a.f)<String(b.f)?-1:1;}).forEach(function(m){mv.push([m.f,m.c,r2(+m.imp||0),m.cat,TIPO[m.cat]||'',m.tar,String(m.f).slice(0,7)]);});
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(mv),'Movimientos');
  var ms=meses(),ev=[['Mes','Ingresos','Gastos','Ahorro']];ms.forEach(function(m){ev.push([m,r2(ingresosDe(m)),r2(gastosDe(m)),r2(ahorroExpDe(m))]);});
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(ev),'Evolución');
  XLSX.writeFile(wb,'mis-gastos-'+new Date().toISOString().slice(0,10)+'.xlsx');}

aplicarTema();
setTab('resumen');
</script>
</body>
</html>
